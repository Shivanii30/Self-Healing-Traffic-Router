global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "routing-engine"
    static_configs:
      - targets:
          - "routing-engine-service:9000"

  - job_name: "health-monitor"
    static_configs:
      - targets:
          - "health-monitor-service:9100"

  - job_name: "circuit-breaker"
    static_configs:
      - targets:
          - "circuit-breaker-service:9200"
